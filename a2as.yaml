  subject:
    name: gersteinlab/medagents-2
    source: https://github.com/gersteinlab/medagents-2
    branch: main
    commit: "aeb62679"
    scope: [expert.py, figures/figure0/plot_utils.py, figures/figure1/cross_talk_dag.py, figures/figure1/plot_utils.py, figures/figure2/plot_utils.py,
      figures/plot_style.py, medagents.py, orchestrate.py, retriever.py, search_tools.py, triage.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:15:27Z'
  signatures:
    digest: sha256:tcjkROHHk-GSTfA5Vq0rCNGn2dBlRiyRuJobi0JGks0
    key: ed25519:b27bo3J9IJ4_t9mzU7KTmJgo1qaRJDnNyAas7CfvMXM
    sig: ed25519:WR7Yitq6cGRydp_6asrRIF_tc4sxbLLv0T9Roza4yIpUWbQjNaJvPPJAQL6ZkP9ZSKwmd-M36wqdXLNeP8yQAQ

agents:
  agent:
    type: instance
    models: [cfg.execution.model.name]
    tools: [search_tools]
    params:
      function: create_expert_agent
      name: ExpertAgent
      output_type: ExpertResponse
      model_settings: ModelSettings(temperature=cfg.execution.model.temperature)
      instructions: [get_expert_instructions]
  agent.create_triage_agent:
    type: factory
    models: [cfg.execution.model.name]
    params:
      function: create_triage_agent
      name: TriageAgent_{difficulty_level.capitalize}
      model_settings: ModelSettings(temperature=cfg.execution.model.temperature)
      output_type: TriageOutput
      instructions: ['{_default_cfg.triage_system_prompt}', '{_default_cfg.triage_template.format}']
  orchestrator_agent:
    type: instance
    models: [cfg.orchestrate.get]
    params:
      function: _create_orchestrator_agent
      name: OrchestratorAgent
      output_type: OrchestratorResponse
      model_settings: ModelSettings(temperature=cfg.orchestrate.get(orchestrator_temperature, cfg.execution.model.temperature))
      instructions: [get_orchestrator_instructions]
  triage_agent:
    type: instance
    models: [cfg.execution.model.name]
    params:
      function: run_triage_agent
      name: TriageAgent
      model_settings: ModelSettings(temperature=cfg.execution.model.temperature)
      handoffs: ['triage_agents[easy]', 'triage_agents[medium]', 'triage_agents[hard]']
      instructions: ['{_default_cfg.difficulty_system_prompt}', '{_default_cfg.difficulty_template.format}']

models:
  cfg.execution.model.name:
    type: variable
    agents: [agent, agent.create_triage_agent, triage_agent]
  cfg.orchestrate.get:
    type: function
    agents: [orchestrator_agent]

tools:
  search_medical_knowledge:
    type: decorator
    params:
      description: |-
        Search for relevant medical knowledge with configurable behavior.

        This is the main search tool that can be configured for different search strategies:
        - Basic retrieval with optional query rewriting
        - Document relevance review and filtering
        - Query similarity checking to avoid duplicates
        - Configurable sources and result limits

        Args:
            query: The search query
            domain: Optional medical domain to focus the search

        Returns:
            List of relevant document texts
  search_tools:
    type: variable
    agents: [agent]
    params:
      dynamic: "True"

teams:
  triage_agent:
    type: handoff
    agents: [triage_agent]

