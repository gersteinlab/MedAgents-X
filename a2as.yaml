    params:
      caller: [os.getenv]
      path: [search_tools]
  OPENAI_API_KEY:
    type: env
    params:
      caller: [os.getenv, AsyncOpenAI]
      path: [main, medagents, run_experiments]
  OPENAI_ENDPOINT:
    type: env
    params:
      caller: [os.getenv]
      path: [main, medagents, run_experiments]

files:
  config.yaml:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [output_dir]
  config_file:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  discussion_patterns.pdf:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [current_dir]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  logs.json:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [output_dir]
  main_figure.pdf:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [current_dir]
  metrics.json:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [output_dir]
  output_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  output_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  summary.json:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [output_dir]
  triage.pdf:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [current_dir]
  usage.json:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
